        const defaultWallpaperSrc = mainWallpaper ? mainWallpaper.src : '';
        const btnResetWall = document.querySelector('.btn_reset_wall');

        if (btnResetWall && mainWallpaper) {
            btnResetWall.addEventListener('click', () => {
              mainWallpaper.src = defaultWallpaperSrc;
              localStorage.removeItem('os_wallpaper'); // Nếu sau này có dùng localStorage
            });
        }
        
        function changeWallpaper2() {
            const thumb = btn_img2.querySelector('img');
            if (mainWallpaper && thumb) {
                mainWallpaper.src = thumb.src;
            }
            btn_img9.classList.remove('max');
        }
        btn_img9.addEventListener('click', changeWallpaper2);
        function changeWallpaper1() {
            const thumb = btn_img1.querySelector('img');
            if (mainWallpaper && thumb) {
               mainWallpaper.src = thumb.src;
            }
            btn_img5.classList.remove('max');
        }
        btn_img5.addEventListener('click', changeWallpaper1);
        

        function opentasbar(){
            tasbar.classList.toggle('hide')
        }
        btn_open_tasbar.addEventListener('click', opentasbar);
        function open_input(){
            input.classList.toggle('hide1')
        }
        btn_open_input.addEventListener('click', open_input)
        
        
        function open_icon_card() {
            card_icon.classList.toggle('hide_icon')
            
        }
        btn_open_icon.addEventListener('click', open_icon_card)
        function open_app1(){
            app.classList.toggle('hide10')
        }
        open_app.addEventListener('click', open_app1)
        const daysOfWeek = [
            "Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư",
            "Thứ Năm", "Thứ Sáu", "Thứ Bảy"
        ];

        function updateClockAndDate() {
            const now = new Date();

            // Cập nhật giờ : phút : giây
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // Cập nhật thứ, ngày / tháng / năm
            const dayName = daysOfWeek[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('date').textContent = `${dayName}, ngày ${day}/${month}/${year}`;
        }

        updateClockAndDate();
        setInterval(updateClockAndDate, 1000);

    </script>
</body>
